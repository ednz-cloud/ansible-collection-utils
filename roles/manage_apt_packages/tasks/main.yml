---
# task/main file for manage_apt_packages
- name: "Update apt caches"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ manage_apt_packages_apt_cache_time }}"

- name: "Compute per-package name spec and effective state"
  ansible.builtin.set_fact:
    _manage_apt_packages_specs: >-
      {%- set _specs = [] -%}
      {%- for pkg in manage_apt_packages_list -%}
        {%- set _version = pkg.get('version') | default(None, true) -%}
        {%- set _ = _specs.append({
              'name': pkg['name'] ~ ((_version not in [None, '', 'latest']) | ternary('=' ~ _version, '')),
              'state': pkg.get('state') | default('present', true)
            }) -%}
      {%- endfor -%}
      {{ _specs }}
  when: manage_apt_packages_list | length > 0

- name: "Install/remove required apt packages"
  ansible.builtin.apt:
    name: "{{ _manage_apt_packages_specs | selectattr('state', 'equalto', item) | map(attribute='name') | list }}"
    state: "{{ item }}"
    allow_downgrade: true
  loop: "{{ _manage_apt_packages_specs | map(attribute='state') | unique | list }}"
  when: manage_apt_packages_list | length > 0
  notify: "apt-autoremove"
